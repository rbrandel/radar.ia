name: Atualização Semanal do Radar de IA

# Como funciona: você (ou o Claude) coloca na raiz do repositório um arquivo novos-AAAA-MM-DD.json
# com os lançamentos da semana. Todo domingo, 08:00 em Brasília, este fluxo junta o arquivo ao data.json,
# apaga o novos-*.json já usado e publica o resultado. Sem arquivo novos-*.json, nada muda.
on:
  schedule:
    - cron: '0 11 * * 0'   # domingo, 11:00 UTC = 08:00 em Brasília
  workflow_dispatch:       # também dá para rodar à mão, na aba Actions

permissions:
  contents: write

concurrency:
  group: radar-atualizacao
  cancel-in-progress: false

jobs:
  update-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Juntar os lançamentos da semana
        run: |
          shopt -s nullglob
          arquivos=(novos-*.json)
          if [ ${#arquivos[@]} -eq 0 ]; then
            echo "Nenhum arquivo novos-*.json encontrado. Nada a fazer."
            exit 0
          fi
          # Em ordem de nome (a data vai no nome), do mais antigo ao mais novo.
          # Se algum arquivo tiver erro, o mesclar.py não grava nada e este passo falha.
          while IFS= read -r arquivo; do
            echo "Processando $arquivo"
            python3 mesclar.py "$arquivo"
            rm -f "$arquivo"
          done < <(printf '%s\n' "${arquivos[@]}" | sort)

      - name: Publicar as alterações
        run: |
          git config user.name "Radar de IA (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nenhuma alteração para publicar."
          else
            git commit -m "chore(auto): atualização semanal do Radar de IA"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
