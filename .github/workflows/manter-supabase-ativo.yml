name: Manter o Supabase ativo

# No plano grátis, o Supabase pausa o projeto depois de 1 semana sem uso. Este fluxo faz uma
# consulta leve toda quinta-feira (08:00 em Brasília) para evitar isso. Se o config.js estiver
# vazio (Supabase ainda não configurado), ele não faz nada. Não altera nem publica arquivos.
on:
  schedule:
    - cron: '0 11 * * 4'   # quinta-feira, 11:00 UTC = 08:00 em Brasília
  workflow_dispatch:       # também dá para rodar à mão, na aba Actions

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Consultar o Supabase
        run: python3 manter_ativo.py
